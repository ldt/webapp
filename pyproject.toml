[project]
name = "webapp"
version = "0.1.0"
description = "A web app with user management using FastAPI, Jinja2 and HTMX"
authors = ["openhands <openhands@all-hands.dev>"]
readme = "README.md"

[dependencies]
python = "^3.10"
fastapi = "^0.115.2"
uvicorn = { extras = ["standard"], version = "^0.30.6" }
jinja2 = "^3.1.4"
htmx = "^0.9.6"
fastapi-users = { extras = ["sqlalchemy"], version = "^14.3.0" }
sqlalchemy = "^2.0"
asyncpg = "^0.29.0"
databases = { extras = ["postgresql"], version = "^0.7.0" }
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }

[dev-dependencies]
pytest = "^8.3.2"
playwright = "^1.49.0"
httpx = "^0.27.0"